<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1A237E" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Geometric Step Icon ("1 STEP") -->
  <g filter="url(#glow)">
    <!-- Base step platform -->
    <path d="M 120 370 L 230 370 L 230 280 L 340 280 L 340 190 L 392 190" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Active Green Steps -->
    <rect x="120" y="340" width="100" height="30" rx="8" fill="rgba(255, 255, 255, 0.15)" />
    <rect x="220" y="250" width="100" height="30" rx="8" fill="rgba(255, 255, 255, 0.3)" />
    
    <!-- The "1 STEP" Next Action Step (Glowing Cedar Green) -->
    <rect x="320" y="160" width="90" height="30" rx="8" fill="url(#stepGrad)" stroke="#81C784" stroke-width="3" />

    <!-- Radiant Ascending Sparkle / Star of Vision -->
    <circle cx="365" cy="115" r="16" fill="url(#goldGrad)" />
    <polygon points="365,85 372,110 397,115 372,120 365,145 358,120 333,115 358,110" fill="#FFFBEB" />
  </g>

  <!-- Typographic "1STEP" text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="6" fill="#F8FAFC" text-anchor="middle" opacity="0.95">1STEP</text>
</svg>
